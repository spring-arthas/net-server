
# 本地开发服务地址；NIO 仍通过 NIO.BIND.IP 监听全部本机网卡。
SERVER.IP = localhost
# 局域网测试默认直接使用明文 TCP，监听全部本机网卡。
NIO.BIND.IP = 0.0.0.0
#SERVER.IP = 172.21.32.120
#SERVER.IP = 192.168.0.101
#SERVER.IP = 192.168.2.106

# 设置ByteBuffer大小 11168，用于设置socketChannel.read(byteBuffer)中byteBuffer大小
BYTE.BUFFER = 40000

# 设置socket接收缓冲区大小
SOCKET.RECEIVE.BUFFER.SIZE = 32500

# 设置socket发送缓冲区大小
SOCKET.SEND.BUFFER.SIZE = 32500

# 设置文件下载时文件每次发送文件流大小
DOWNLOAD.SEND.BYTE.BUFFER = 32500

# 设置Write Event写事件处理时间(ms为单位)
SELECTOR.WRITE.EVENT.HANDLER.TIME = 10000

# 设置socket超时

# 设置socket重连次数
SOCKET.RECONNECTED.COUNT = 5

# 设置selector循环被阻塞秒数
SELECTOR.POLL.TIMEOUT = 2000

# 最大写入次数
WRITE.MAX.WAIT.COUNT = 5

# NIO 原生端口
NIO.TEXT.PORT = 10086
NIO.FILE.UPLOAD.PORT = 10087
NIO.FILE.DOWNLOAD.PORT = 10088
NIO.FILE.RESUME.UPLOAD.PORT = 10089
NIO.FILE.RESUME.DOWNLOAD.PORT = 10090
NIO.WEBSOCKET.PORT = 10089

NIO.MEDIA.STREAM.PORT = 10188
NIO.MEDIA.STREAM.BIND.IP = 0.0.0.0
MEDIA.STREAM.PUBLIC.HOST = auto
MEDIA.STREAM.PUBLIC.SCHEME = http

# 局域网测试默认关闭 TLS；如需公网部署，再显式开启并配置受信任证书。
TLS.GATEWAY.ENABLED = false
# 自动选择当前有效物理网卡地址；NET_SERVER_PUBLIC_IP 仍具有最高优先级。
TLS.GATEWAY.PUBLIC.IP = auto
TLS.GATEWAY.KEYSTORE.PATH.WINDOWS = ${user.home}/.net-server/tls/net-server.p12
TLS.GATEWAY.KEYSTORE.PATH.MACOS = ${user.home}/.net-server/tls/net-server.p12
TLS.GATEWAY.KEYSTORE.PATH.LINUX = ${user.home}/.net-server/tls/net-server.p12
# Generic fallback for unknown operating systems and older deployments.
TLS.GATEWAY.KEYSTORE.PATH = ${user.home}/.net-server/tls/net-server.p12
# 缺失时由 Java 在当前 user.home 下创建本机 CA 和 PKCS12。
TLS.GATEWAY.KEYSTORE.AUTO.CREATE = true
TLS.GATEWAY.HANDSHAKE.TIMEOUT.MILLIS = 10000
TLS.GATEWAY.CONNECT.TIMEOUT.MILLIS = 10000
TLS.GATEWAY.IDLE.TIMEOUT.MILLIS = 300000
TLS.GATEWAY.MAX.CONNECTIONS = 512
TLS.GATEWAY.BUFFER.SIZE = 65536

# [修改] 密钥由 MEDIA_STREAM_TOKEN_SECRET 或本机私密文件提供，仓库不保存默认值。
MEDIA.STREAM.TOKEN.SECRET =
MEDIA.STREAM.TOKEN.EXPIRE.SECONDS = 300
MEDIA.STREAM.BUFFER.SIZE = 262144
MEDIA.STREAM.MAX.THREADS = 64
MEDIA.STREAM.MAX.CONNECTIONS.PER.USER = 8
# [修改] 密钥由 FILE_TRANSFER_TOKEN_SECRET 或本机私密文件提供，仓库不保存默认值。
FILE.TRANSFER.TOKEN.SECRET =
FILE.TRANSFER.TOKEN.EXPIRE.SECONDS = 86400
# Optional override. When blank, a private value is generated once at ~/.net-server/user-session-token.secret.
USER.SESSION.TOKEN.SECRET =
USER.SESSION.TOKEN.EXPIRE.SECONDS = 604800

# Windows 上传根目录；父目录不存在时由服务自动创建。
NIO.FILE.BASE.PATH.WINDOWS = E:\\storage\\upload\\file
# Mac/Linux 使用独立目录，不读取 Windows 路径。
NIO.FILE.BASE.PATH.LINUX.MAC = /Users/hljy/Documents/storages/

# 基于Netty的聊天以及webSocket协议,以及文件服务端口
NETTY.SERVER.PROTOCOL.PORT = 60100,60101,60102

# 文件上传配置
# 单连接上传速率限制（字节/秒），默认 2MB/s
FILE.UPLOAD.PER.CONNECTION.MAX.RATE.BPS = 52428800

# 全局总上传速率限制（字节/秒），默认 20MB/s
FILE.UPLOAD.GLOBAL.RATE.BPS = 104857600

# 最大并发上传数，默认 30
FILE.UPLOAD.MAX.CONCURRENT.UPLOADS = 30

# 是否启用动态速率调整，默认 false
FILE.UPLOAD.ENABLE.DYNAMIC.RATE.ADJUSTMENT = true

# 令牌桶容量倍数，默认 2
FILE.UPLOAD.BUCKET.CAPACITY.MULTIPLIER = 2

FILE.UPLOAD.ADAPTIVE.CHUNK.MIN.BYTES = 32768
FILE.UPLOAD.ADAPTIVE.CHUNK.INITIAL.BYTES = 65536
FILE.UPLOAD.ADAPTIVE.CHUNK.MAX.BYTES = 524288
FILE.UPLOAD.ADAPTIVE.ACK.INITIAL.BYTES = 1048576
FILE.UPLOAD.ADAPTIVE.ACK.MAX.BYTES = 8388608
